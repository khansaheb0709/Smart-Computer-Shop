<style>
.cust-grid{display:grid;grid-template-columns:340px 1fr;gap:var(--sp-3);align-items:start}
@media (max-width:900px){.cust-grid{grid-template-columns:1fr}}
.cust-item{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;margin-bottom:8px;cursor:pointer}
.cust-item:hover{border-color:var(--green)}
.cust-item.active{border-color:var(--green);box-shadow:0 0 0 2px var(--green)}
.cust-name{font-weight:700}
.cust-sub{font-size:12px;color:var(--muted)}
.file-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.file-item{border:1px solid var(--line);border-radius:8px;padding:8px;background:#fffdf2;font-size:12px;word-break:break-all}
.file-item a{color:var(--green);font-weight:600}
</style>

  <div class="container">
    <div class="gate-403" id="gate403" hidden><h1>প্রবেশ নিষিদ্ধ</h1><p class="muted">আপনি এডমিন নন।</p><p><a class="btn btn-primary" href="login.html?next=admin-customers.html">সাইন ইন করুন</a></p></div>

      <div class="field" style="max-width:420px"><label for="searchInput">খুঁজুন (ফোন/নাম)</label><input id="searchInput" inputmode="search" placeholder="017XXXXXXXX বা নাম" autocomplete="off"></div>

      <div class="cust-grid">
        <div id="custList" aria-label="কাস্টমার তালিকা"></div>

      </div>
    </div>
